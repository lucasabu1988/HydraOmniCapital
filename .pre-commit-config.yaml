# TASK-368. Existing json/yaml hooks kept; ruff now uses hydra_screener_local/ruff.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: ["--config", "hydra_screener_local/ruff.toml"]
        files: ^hydra_screener_local/
