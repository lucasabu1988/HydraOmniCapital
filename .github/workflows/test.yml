name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # TASK-388. The two triggers above are the only ones there were, so a push to a
  # feature branch ran nothing at all: on 2026-09-07, thirteen live branches had
  # `total_count 0` workflow runs, n-sleeve-engine (13 commits of engine code) among
  # them. A draft PR is the usual way to get `pull_request` to fire without making a
  # branch mergeable -- but a *conflicted* PR creates no run whatsoever (measured:
  # PR #45 on n-sleeve-engine, DIRTY, produced zero runs, while seven draft PRs on
  # branches that merge clean each produced one). So for a branch that is behind main
  # the PR route is unavailable exactly when CI is most wanted. workflow_dispatch
  # tests a ref as it is, with no merge commit and no PR.
  workflow_dispatch:

jobs:
  # Active product. Legacy COMPASS tests lived at repo-root tests/ and were archived to
  # archive/root-legacy-2026-09/ on 2026-09-05; they are not run.
  # run_all_tests.py routes pytest-style files through pytest, reports skips apart from passes,
  # and exits non-zero on any failure. Offline (synthetic data, patched network);
  # test_hybrid_integration skips without history/.
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: hydra_screener_local

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install screener + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Screener test suite + coverage
        run: python run_all_tests.py --cov --strict-console

      - name: Upload coverage XML
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: hydra_screener_local/coverage.xml

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: hydra_screener_local
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff
        run: python -m ruff check core data utils sleeves portfolio_v9.py daily.py dashboard_v9.py preflight.py reconcile.py confirm_fills.py journal.py store_cli.py evidence_review.py warm_sectors.py send_hydra_summary.py console_dashboard.py snapshot_universe.py verify_state.py runlog_cli.py reprint_sheet.py --config ruff.toml
      - name: Ruff tests
        run: python -m ruff check --config ruff.toml test_*.py
