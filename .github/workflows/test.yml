name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: >
          pytest tests/ -v --tb=short
          --cov-config=.coveragerc
          --cov=compass_api_models
          --cov=compass_dashboard
          --cov=compass_dashboard_cloud
          --cov=compass_ml_learning
          --cov-report=term-missing
          --cov-fail-under=30

      - name: Test hydra_backtest package
        run: >
          pytest hydra_backtest/tests/ -v --tb=short
          --cov=hydra_backtest
          --cov-report=term-missing
          -m "not slow"

      - name: Test hydra_backtest.rattlesnake sub-package
        run: >
          pytest hydra_backtest/rattlesnake/tests/ -v --tb=short
          --cov=hydra_backtest.rattlesnake
          --cov-report=term-missing
          -m "not slow"

      - name: Test hydra_backtest.catalyst sub-package
        run: >
          pytest hydra_backtest/catalyst/tests/ -v --tb=short
          --cov=hydra_backtest.catalyst
          --cov-report=term-missing
          -m "not slow"

      - name: Test hydra_backtest.efa sub-package
        run: >
          pytest hydra_backtest/efa/tests/ -v --tb=short
          --cov=hydra_backtest.efa
          --cov-report=term-missing
          -m "not slow"

      - name: Test hydra_backtest.hydra sub-package
        run: >
          pytest hydra_backtest/hydra/tests/ -v --tb=short
          --cov=hydra_backtest.hydra
          --cov-report=term-missing
          -m "not slow"

      - name: Coverage report
        if: always()
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Coverage report unavailable" >> $GITHUB_STEP_SUMMARY

  # The active project. Until 2026-09-06 CI ran only the frozen legacy engine above and not a
  # single screener test (audit S1). Separate job so a legacy failure cannot mask a screener one.
  # run_all_tests.py routes pytest-style files through pytest, reports skips apart from passes,
  # and exits non-zero on any failure. Everything it runs is offline (synthetic data, patched
  # network); test_hybrid_integration skips without history/.
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hydra_screener_local

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install screener dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Screener test suite
        run: python run_all_tests.py
