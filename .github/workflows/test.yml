name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Active product. Legacy COMPASS tests lived at repo-root tests/ and were archived to
  # archive/root-legacy-2026-09/ on 2026-09-05; they are not run.
  # run_all_tests.py routes pytest-style files through pytest, reports skips apart from passes,
  # and exits non-zero on any failure. Offline (synthetic data, patched network);
  # test_hybrid_integration skips without history/.
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hydra_screener_local

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install screener dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-timeout   # hydra_screener_local/pytest.ini --timeout=30

      - name: Screener test suite
        run: python run_all_tests.py
