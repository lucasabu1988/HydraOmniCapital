name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Frozen legacy engine. The coverage gate is gone (2026-09-06): the four --cov targets are
      # not imported by anything under tests/, so total coverage was 0.00% and the job failed on
      # --cov-fail-under on every run while all 481 tests passed - a permanently red job that
      # nobody reads. Tests must still pass; the coverage report stays informational.
      - name: Legacy tests
        run: pytest tests/ -v --tb=short

      # hydra_backtest/ (63 files, last touched 2026-05-31) imports nine signal functions from
      # omnicapital_live.py, deleted on 2026-06-05 (2742cfb). Its conftest has failed at import on
      # every CI run since - hidden first by the coverage gate, then by a collection error. The five
      # steps that ran its test trees were removed on 2026-09-06 so this job reports what actually
      # runs. Whether to delete the package or restore those functions from git history is Lucas's
      # call; see .comms/claude-project-audit-2026-09-06.md follow-up.

  # The active project. Until 2026-09-06 CI ran only the frozen legacy engine above and not a
  # single screener test (audit S1). Separate job so a legacy failure cannot mask a screener one.
  # run_all_tests.py routes pytest-style files through pytest, reports skips apart from passes,
  # and exits non-zero on any failure. Everything it runs is offline (synthetic data, patched
  # network); test_hybrid_integration skips without history/.
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hydra_screener_local

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install screener dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-timeout   # root pytest.ini sets --timeout=30

      - name: Screener test suite
        run: python run_all_tests.py
