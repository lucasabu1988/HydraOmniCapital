[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra-screener-local"
version = "0.2.0"
description = "HYDRA v9 local portfolio screener (T20 momentum + ETF trend)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "yfinance",
    "openpyxl",
    "requests",
]
authors = [
  { name="HYDRA Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
hydra-daily = "daily:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "data*", "utils*", "sleeves*"]
