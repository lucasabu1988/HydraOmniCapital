# TASK-368 — lint for core/, data/, utils/, sleeves/ and the v9 CLIs.
# No mass reformat: E501 (line wrap) and I (isort) stay as policy for new code
# but existing files are not rewritten. CI runs `ruff check`.
line-length = 120
target-version = "py312"
src = ["."]

[lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E501",  # line length: 120 is the cap for new code; wrapping the tree is a mass reformat
    "E402",  # module import not at top — CLIs and tests insert sys.path first
    "I001",  # isort: applying it is a mass reformat; keep the rule selected for later
]

[lint.per-file-ignores]
# Live path FROZEN until Claude posts "first settle verified" (2026-09-08).
# Findings listed in .comms/grok-task-368-hygiene.md; not fixed here.
"core/**" = ["E", "F", "I", "B"]
"portfolio_v9.py" = ["E", "F", "I", "B"]
"daily.py" = ["E", "F", "I", "B"]
"preflight.py" = ["E", "F", "I", "B"]
# Legacy scripts and Pine tools: not in the lint surface.
"screener.py" = ["E", "F", "I", "B"]
"analyze_history.py" = ["E", "F", "I", "B"]
"log_cycle_positions.py" = ["E", "F", "I", "B"]
"generate_pine_watchlist.py" = ["E", "F", "I", "B"]
"validate_pine_contract.py" = ["E", "F", "I", "B"]
"pine/**" = ["E", "F", "I", "B"]
"experiments/**" = ["E", "F", "I", "B"]
"test_*.py" = ["I"]
"experiments/test_*.py" = ["I"]
