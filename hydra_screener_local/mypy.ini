; Type checking where it is reasonable (audit phase 10.6).
;
; Only the modules this audit added or rewrote are checked. Annotating the whole tree
; retroactively is a mass edit CLAUDE.md rules out, and a gate that passes because
; everything is ignored is not a gate. The list grows as modules are touched.
;
;   python -m mypy --config-file mypy.ini

[mypy]
python_version = 3.12
files =
    core/numbers.py,
    core/ledger.py,
    core/commit.py,
    core/baseline.py,
    core/alerts.py,
    data/quality.py,
    data/universe_registry.py,
    tools/check_coverage.py,
    tools/check_skips.py,
    tools/check_secrets.py,
    tools/precommit_gates.py,
;   tier 2 (TASK-390): modules the audit rewrote heavily, annotated afterwards
    core/dividends.py,
    core/journal.py,
    core/state_migrations.py,
    data/pit.py,
    utils/runlog.py,
;   tier 3 (TASK-390 follow-up): fixed with annotations and narrowing only — no logic
;   change, because six of these are on the live money path and it is frozen. The 15
;   errors the bundle cost, and what each fix was:
;     core/tranche_book.py    2  dict annotation; px.get(tk) -> px.get(tk, nan) in a
;                                comprehension already guarded by isfinite(px.get(tk, nan))
;     core/fills.py           1  int(row.get("tranche")) keeps its deliberate TypeError arm
;                                behind an arg-type ignore instead of a new `if`
;     core/state_check.py     3  cast() over config.V9 lookups (V9 is a heterogeneous
;                                literal, so every V9.get() is typed `object`) + one local
;     core/portfolio_state.py 0  already clean
;     core/regime.py          1  implicit Optional default
;     reconcile.py            4  broker_cash / rows annotated dict[str, Any]
;     utils/env.py            1  unused type: ignore (ignore_missing_imports covers it)
;     utils/trading_calendar.py 0 already clean
;     utils/display.py        3  implicit Optional defaults
    core/tranche_book.py,
    core/fills.py,
    core/state_check.py,
    core/portfolio_state.py,
    core/regime.py,
    reconcile.py,
    utils/env.py,
    utils/trading_calendar.py,
    utils/display.py
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True
check_untyped_defs = True
; the tree is mostly unannotated, so requiring annotations here would only produce
; noise about the modules these ones call into
disallow_untyped_defs = False
ignore_missing_imports = True

; pandas is used for its runtime behaviour, not its type surface; pandas-stubs
; disagrees with the code in ways that are not bugs
[mypy-pandas.*]
ignore_missing_imports = True
follow_imports = skip

; config.py and data/sectors.py are imported by the checked modules but are not
; themselves audited yet: follow them for types, do not report their own errors.
[mypy-config]
follow_imports = silent

[mypy-data.sectors]
follow_imports = silent
