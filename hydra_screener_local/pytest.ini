[pytest]
# -rs: print the REASON of every skip. A skipped test that reports only as an anonymous
# 'N skipped' count is how this project's parity tests went unrun for months.
addopts = --tb=short --timeout=30 -rs
markers =
    defect: documents a KNOWN-BROKEN behaviour, not coverage. `pytest -m defect` lists them.
        A `defect` test is either an xfail(strict=True) written against the desired behaviour
        (so it turns red the day the fix lands) or the evidence that the defect is currently
        unreachable from the live path. Never read one as proof the behaviour is correct.
